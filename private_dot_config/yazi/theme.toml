# : Manager [[[

[mgr]
cwd = { fg = "#d5bfb9" }

# Tab
tab_active = { fg = "#3d0a00", bg = "#fe724a", bold = true }
tab_inactive = { fg = "#972904", bg = "#ffe4dd" }
tab_width = 1

# Find
find_keyword = { fg = "#ff7063", bold = true, italic = true, underline = true }
find_position = { fg = "#ff7063", bold = true, italic = true }

# Marker
marker_copied = { fg = "#00a5da", bg = "#00a5da" }
marker_cut = { fg = "#005874", bg = "#005874" }
marker_marked = { fg = "#ff7063", bg = "#ff7063" }
marker_selected = { fg = "#3ea8d3", bg = "#3ea8d3" }

# Count
count_copied = { fg = "#d1eeff", bg = "#005874" }
count_cut = { fg = "#d1eeff", bg = "#005874" }
count_selected = { fg = "#3d0a00", bg = "#3ea8d3" }

# Border
border_symbol = " "
border_style  = { fg = "#ffb5a0" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#3d0a00", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#fe724a", fg = "#3d0a00", bold = true }
normal_alt  = { bg = "#58413b", fg = "#b4978f" }

# Select mode
select_main = { bg = "#d78a74", fg = "#340901", bold = true }
select_alt  = { bg = "#58413b", fg = "#b4978f" }

# Unset mode
unset_main = { bg = "#3ea8d3", fg = "#001b26", bold = true }
unset_alt  = { bg = "#58413b", fg = "#b4978f" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#fe724a", bg = "#453632" }
progress_error = { fg = "#ff7063", bg = "#453632" }

# Permissions
permissions_t = { fg = "#8a3e28" }
permissions_w = { fg = "#164c62" }
permissions_x = { fg = "#c91100" }
permissions_r = { fg = "#0ec5ff" }
permissions_s = { fg = "#fa6a3a" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#fe724a" }
active = { fg = "#3ea8d3", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#fe724a" }
value = { fg = "#d5bfb9" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#fe724a", bold = true, bg = "#1c110d" }
inactive = { fg = "#d78a74", bg = "#1c110d" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#fe724a", bg = "#3d0a00" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#fe724a" }
title = {}
hovered = { fg = "#005874", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#453632" }
cand = { fg = "#fe724a" }
rest = { fg = "#3d0a00" }
desc = { fg = "#d5bfb9" }
separator = " ▶ "
separator_style = { fg = "#d5bfb9" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#d5bfb9" }
run = { fg = "#d5bfb9" }
footer = { fg = "#340901", bg = "#d78a74" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#3ea8d3" }
title_warn = { fg = "#fe724a" }
title_error = { fg = "#ff7063" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#7b0007" },
    { name = "*", is = "exec", fg = "#ffb1a8" },

    # Fallback
    { name = "*", fg = "#d5bfb9" },
    { name = "*/", fg = "#ffb5a0" },
]

# : ]]]
