# : Manager [[[

[mgr]
cwd = { fg = "#c3c3c3" }

# Tab
tab_active = { fg = "#152000", bg = "#89a847", bold = true }
tab_inactive = { fg = "#405900", bg = "#d4f68a" }
tab_width = 1

# Find
find_keyword = { fg = "#ff7063", bold = true, italic = true, underline = true }
find_position = { fg = "#ff7063", bold = true, italic = true }

# Marker
marker_copied = { fg = "#4c9e93", bg = "#4c9e93" }
marker_cut = { fg = "#2b5953", bg = "#2b5953" }
marker_marked = { fg = "#ff7063", bg = "#ff7063" }
marker_selected = { fg = "#78a69f", bg = "#78a69f" }

# Count
count_copied = { fg = "#c3f3eb", bg = "#2b5953" }
count_cut = { fg = "#c3f3eb", bg = "#2b5953" }
count_selected = { fg = "#152000", bg = "#78a69f" }

# Border
border_symbol = " "
border_style  = { fg = "#b1d26b" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#152000", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#89a847", fg = "#152000", bold = true }
normal_alt  = { bg = "#474747", fg = "#9d9d9d" }

# Select mode
select_main = { bg = "#99a183", fg = "#141a07", bold = true }
select_alt  = { bg = "#474747", fg = "#9d9d9d" }

# Unset mode
unset_main = { bg = "#78a69f", fg = "#001c19", bold = true }
unset_alt  = { bg = "#474747", fg = "#9d9d9d" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#89a847", bg = "#393939" }
progress_error = { fg = "#ff7063", bg = "#393939" }

# Permissions
permissions_t = { fg = "#4a4f3c" }
permissions_w = { fg = "#35504c" }
permissions_x = { fg = "#c91100" }
permissions_r = { fg = "#67b6ab" }
permissions_s = { fg = "#aef200" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#89a847" }
active = { fg = "#78a69f", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#89a847" }
value = { fg = "#c3c3c3" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#89a847", bold = true, bg = "#131313" }
inactive = { fg = "#99a183", bg = "#131313" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#89a847", bg = "#152000" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#89a847" }
title = {}
hovered = { fg = "#2b5953", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#393939" }
cand = { fg = "#89a847" }
rest = { fg = "#152000" }
desc = { fg = "#c3c3c3" }
separator = " ▶ "
separator_style = { fg = "#c3c3c3" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#c3c3c3" }
run = { fg = "#c3c3c3" }
footer = { fg = "#141a07", bg = "#99a183" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#78a69f" }
title_warn = { fg = "#89a847" }
title_error = { fg = "#ff7063" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#7b0007" },
    { name = "*", is = "exec", fg = "#ffb1a8" },

    # Fallback
    { name = "*", fg = "#c3c3c3" },
    { name = "*/", fg = "#b1d26b" },
]

# : ]]]
