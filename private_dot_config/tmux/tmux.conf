set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",screen-256color:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",foot:RGB"
set -as terminal-features ",kitty:RGB"
set -as terminal-features ",wezterm:RGB"
set -as terminal-features ",xterm-256color:focus"
set -as terminal-features ",screen-256color:focus"
set -as terminal-features ",alacritty:focus"
set -as terminal-features ",foot:focus"
set -as terminal-features ",kitty:focus"
set -as terminal-features ",wezterm:focus"

set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g repeat-time 350
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy on
set -g set-clipboard on
set -g status-keys vi
setw -g mode-keys vi
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind c new-window -c "#{pane_current_path}"
bind Enter new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind Tab last-window
bind w choose-tree -Zw
bind m display-menu -T " tmux menu " -x R -y P \
  "[s] sessions" s "display-popup -E -T 'sessions' -w 76% -h 78% 'bash /home/olli/.config/tmux/bin/tmux-fzf-sessions'" \
  "[w] windows" w "display-popup -E -T 'windows' -w 76% -h 78% 'bash /home/olli/.config/tmux/bin/tmux-fzf-windows'" \
  "[t] scratch" t "display-popup -E -T 'scratch' -w 82% -h 82% -d '#{pane_current_path}'" \
  "[?] keys" '?' "display-popup -E -T 'tmux keys' -w 64% -h 72% 'bash /home/olli/.config/tmux/bin/tmux-popup-help'" \
  "[l] layouts" l "choose-tree -Zw" \
  "[r] reload" r "source-file ~/.config/tmux/tmux.conf"
bind S display-popup -E -T "sessions" -w 76% -h 78% "bash /home/olli/.config/tmux/bin/tmux-fzf-sessions"
bind W display-popup -E -T "windows" -w 76% -h 78% "bash /home/olli/.config/tmux/bin/tmux-fzf-windows"
bind T display-popup -E -T "scratch" -w 82% -h 82% -d "#{pane_current_path}"
bind ? display-popup -E -T "tmux keys" -w 64% -h 72% "bash /home/olli/.config/tmux/bin/tmux-popup-help"
bind z resize-pane -Z
bind Space next-layout
bind x confirm-before -p "Kill pane #P? (y/n)" kill-pane
bind X confirm-before -p "Kill window #I? (y/n)" kill-window
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

bind y copy-mode
bind p paste-buffer
bind P run-shell "command -v wl-paste >/dev/null 2>&1 && wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
if-shell "command -v wl-copy >/dev/null 2>&1" "set -s copy-command 'wl-copy'"

set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 32
set -g status-right-length 96

set -g status-style "bg=#191724,fg=#908caa"
set -g message-style "bg=#1f1d2e,fg=#e0def4"
set -g message-command-style "bg=#1f1d2e,fg=#f6c177"
set -g mode-style "bg=#26233a,fg=#e0def4"
set -g pane-border-lines single
set -g pane-border-style "fg=#403d52"
set -g pane-active-border-style "fg=#9ccfd8"
set -g popup-style "bg=#1f1d2e,fg=#e0def4"
set -g popup-border-style "fg=#9ccfd8,bg=#1f1d2e"
set -g display-panes-colour "#6e6a86"
set -g display-panes-active-colour "#ebbcba"
setw -g clock-mode-colour "#c4a7e7"

setw -g window-status-separator " "
setw -g window-status-format "#[fg=#6e6a86,bg=#191724] #I:#W "
setw -g window-status-current-format "#[fg=#191724,bg=#9ccfd8,bold] #I:#W "
setw -g window-status-activity-style "fg=#f6c177,bg=#191724"
setw -g window-status-bell-style "fg=#191724,bg=#eb6f92,bold"

set -g status-left "#[fg=#191724,bg=#ebbcba,bold] #S #[fg=#ebbcba,bg=#191724]|"
set -g status-right "#[fg=#eb6f92]#{?client_prefix,[prefix] ,}#[fg=#9ccfd8]#{b:pane_current_path} #[fg=#6e6a86]| #[fg=#f6c177]%H:%M #[fg=#6e6a86]| #[fg=#c4a7e7]%a %d %b "

if-shell "[ -f ~/.config/tmux/tmux.local.conf ]" "source-file ~/.config/tmux/tmux.local.conf"
